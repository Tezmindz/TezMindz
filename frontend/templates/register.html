<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=/?auth=register">
    <title>Redirecting — Tezz-Mindz</title>
    <script>
        (function() {
            var search = window.location.search || '';
            var target = '/?auth=register';
            if (search) {
                var clean = search.startsWith('?') ? search.substring(1) : search;
                target += '&' + clean;
            }
            window.location.replace(target);
        })();
    </script>
</head>
<body style="font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f8fafc; color: #475569;">
    <div style="text-align: center;">
        <p style="font-size: 1.1rem; font-weight: 600;">Redirecting to Tezz-Mindz registration...</p>
        <p style="font-size: 0.9rem; color: #94a3b8;">If you are not redirected automatically, <a href="/?auth=register" style="color: #4f46e5; text-decoration: underline;">click here</a>.</p>
    </div>
</body>
</html>
